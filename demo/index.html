  <body data-plugin="intensifier">
    <main id="demo">
      <noscript>
        <h1>SW Intensifier</h1>
        <p>
          An FFGL effect that looks at your clip through a night-vision image
          intensifier tube, Gen 2 or Gen 3. The tube counts: light at its
          photocathode becomes a sparse stream of photoelectrons, each multiplied
          by the microchannel plate by a gain that is different every time, and
          each burst lights a spot of green or white phosphor. So the picture
          scintillates at starlight and thickens as the light comes up, halos ring
          bright points, the whole frame dims when a torch comes in, and a faint
          honeycomb shows at high light. None of it is drawn.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2 with float render targets.
          The plugin itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/intensifier">its repository</a>.
        </p>
        <ul>
          <li><a href="https://github.com/stoatworks-labs/intensifier">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
